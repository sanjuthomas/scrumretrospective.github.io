# Deploy sync API to Railway on version tags (paired with GitHub Pages release).
# Secrets: RAILWAY_TOKEN (project token), RAILWAY_SERVICE_ID (service UUID from Railway).
name: Deploy sync API to Railway

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Check Railway secrets
        id: check
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: set RAILWAY_TOKEN and RAILWAY_SERVICE_ID in GitHub Actions secrets."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
      - if: steps.check.outputs.skip != 'true'
        run: npm install -g @railway/cli
      - name: Deploy server
        if: steps.check.outputs.skip != 'true'
        working-directory: server
        run: railway up --detach --service "$RAILWAY_SERVICE_ID"
